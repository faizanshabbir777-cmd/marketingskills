<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="IKSIR — bilingual seal wordmark">
  <title>IKSIR — Bilingual Seal wordmark</title>
  <desc>Circular seal with Arabic إكسير arched along the top and Latin IKSIR along the bottom; central crescent + droplet motif.</desc>
  <defs>
    <style>
      .iksir-latin { font-family: 'Cormorant Garamond', 'Cormorant', 'Tiempos', Georgia, serif; font-weight: 500; letter-spacing: 0.42em; }
      .iksir-arabic { font-family: 'Amiri', 'Noto Naskh Arabic', 'Scheherazade', serif; font-weight: 600; }
      .iksir-tag { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.32em; }
    </style>
    <path id="arabicArc" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <path id="latinArc" d="M 30 100 A 70 70 0 0 0 170 100" fill="none"/>
  </defs>

  <g id="seal" transform="translate(0,0)" fill="currentColor">
    <circle cx="100" cy="100" r="82" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="100" cy="100" r="74" fill="none" stroke="currentColor" stroke-width="0.6"/>
    <text class="iksir-arabic" font-size="22" fill="currentColor" text-anchor="middle">
      <textPath href="#arabicArc" startOffset="50%">إكسير</textPath>
    </text>
    <text class="iksir-latin" font-size="13" fill="currentColor" text-anchor="middle">
      <textPath href="#latinArc" startOffset="50%">ELIXIR FOR WOMEN</textPath>
    </text>

    <g id="centerMotif" transform="translate(100,100)">
      <path d="M -16 -8 A 18 18 0 1 0 -16 12 A 14 14 0 1 1 -16 -8 Z" fill="currentColor"/>
      <path d="M 8 -2 C 8 -10, 14 -14, 14 -4 C 14 4, 8 6, 8 -2 Z" fill="currentColor"/>
    </g>
  </g>

  <g id="lockup-text" fill="currentColor" transform="translate(220,80)">
    <text class="iksir-latin" x="0" y="32" font-size="56">IKSIR</text>
    <line x1="0" y1="56" x2="220" y2="56" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>
    <text class="iksir-tag" x="0" y="78" font-size="11" opacity="0.8">CREATINE · COLLAGEN · IRON</text>
  </g>
</svg>
