<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="IKSIR — crescent-counter wordmark">
  <title>IKSIR — Crescent-Counter wordmark</title>
  <desc>Geometric humanist sans wordmark; the I in IKSIR is replaced by a circle-and-crescent monogram that lives at the same x-height as the surrounding letters.</desc>
  <defs>
    <style>
      .iksir-word { font-family: 'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, 'Helvetica Neue', sans-serif; font-weight: 600; letter-spacing: 0.18em; }
    </style>
    <mask id="ccMask01">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <circle cx="58" cy="50" r="22" fill="black"/>
    </mask>
  </defs>

  <g id="wordmark" fill="currentColor">
    <g id="mark" transform="translate(20,20)">
      <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="6"/>
      <g mask="url(#ccMask01)">
        <circle cx="46" cy="50" r="22" fill="currentColor"/>
      </g>
      <circle cx="46" cy="20" r="4" fill="currentColor"/>
    </g>

    <text id="letters" x="140" y="78" class="iksir-word" font-size="64">
      <tspan>K</tspan><tspan dx="2">S</tspan><tspan dx="2">I</tspan><tspan dx="2">R</tspan>
    </text>
  </g>
</svg>
