<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IKSIR globe-crescent mark">
  <title>IKSIR — Globe-Crescent mark</title>
  <desc>Crescent shape with thin meridian lines that read as a globe.</desc>
  <defs>
    <mask id="globeCut">
      <rect width="100" height="100" fill="white"/>
      <circle cx="62" cy="50" r="32" fill="black"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <g mask="url(#globeCut)">
      <circle cx="50" cy="50" r="40" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.55">
      <ellipse cx="50" cy="50" rx="40" ry="40"/>
      <ellipse cx="50" cy="50" rx="40" ry="14"/>
      <ellipse cx="50" cy="50" rx="22" ry="40"/>
      <line x1="10" y1="50" x2="90" y2="50"/>
    </g>
  </g>
</svg>
