<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="IKSIR — globe-crescent wordmark">
  <title>IKSIR — Globe-Crescent wordmark</title>
  <desc>High-contrast didone-style wordmark with a crescent-globe mark; the crescent is overlaid with thin meridian lines that suggest a globe.</desc>
  <defs>
    <style>
      .iksir-didone { font-family: 'Playfair Display', 'Bodoni Moda', 'Didot', 'Times New Roman', serif; font-weight: 500; letter-spacing: 0.36em; }
    </style>
    <mask id="globeCutout">
      <rect width="100" height="100" fill="white"/>
      <circle cx="62" cy="50" r="32" fill="black"/>
    </mask>
  </defs>

  <g id="mark-gc" transform="translate(20,20)" fill="currentColor">
    <g mask="url(#globeCutout)">
      <circle cx="50" cy="50" r="40" fill="currentColor"/>
    </g>
    <g stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.55">
      <ellipse cx="50" cy="50" rx="40" ry="40"/>
      <ellipse cx="50" cy="50" rx="40" ry="14"/>
      <ellipse cx="50" cy="50" rx="22" ry="40"/>
      <line x1="10" y1="50" x2="90" y2="50"/>
    </g>
  </g>

  <g id="word-gc" transform="translate(140,0)" fill="currentColor">
    <text class="iksir-didone" x="0" y="78" font-size="64">IKSIR</text>
  </g>
</svg>
