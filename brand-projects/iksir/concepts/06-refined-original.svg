<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="IKSIR — refined original wordmark">
  <title>IKSIR — Refined Original wordmark</title>
  <desc>The current IKSIR wordmark refined: K tail tightened to terminate within cap height, crescent reduced to a brand element above the wordmark rather than an i-dot, optical-corrected counters.</desc>
  <defs>
    <style>
      .iksir-serif { font-family: 'Cormorant Garamond', 'Cormorant', 'Tiempos Headline', Georgia, serif; font-weight: 500; letter-spacing: 0.10em; }
    </style>
  </defs>

  <g id="crescent-glyph" transform="translate(220,8)" fill="currentColor">
    <path d="M 28 16 A 12 12 0 1 1 14 4 A 9 9 0 1 0 28 16 Z" fill="currentColor"/>
  </g>

  <g id="word-refined" fill="currentColor">
    <text class="iksir-serif" x="40" y="86" font-size="84">IKSIR</text>
    <g id="k-tail" transform="translate(135,40)" fill="currentColor">
      <path d="M 0 36 C 6 38, 14 40, 22 36 C 14 42, 6 44, -2 42 Z" opacity="0.95"/>
    </g>
  </g>
</svg>
