<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IKSIR refined K monogram">
  <title>IKSIR — Refined K monogram</title>
  <desc>A refined K monogram inside a circular badge: the calligraphic tail is preserved but optically balanced; a small crescent sits above the K's apex.</desc>
  <defs>
    <style>
      .km { font-family: 'Cormorant Garamond', 'Cormorant', 'Tiempos Headline', Georgia, serif; font-weight: 600; }
    </style>
  </defs>
  <g fill="currentColor">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M 56 14 A 6 6 0 1 1 49 9 A 4.5 4.5 0 1 0 56 14 Z" fill="currentColor"/>
    <text class="km" x="50" y="74" font-size="60" text-anchor="middle" fill="currentColor">K</text>
    <path d="M 64 70 C 70 72, 76 70, 80 66 C 76 74, 70 76, 62 74 Z" fill="currentColor"/>
  </g>
</svg>
