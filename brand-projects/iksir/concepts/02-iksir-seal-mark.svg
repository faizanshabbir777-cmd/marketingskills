<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IKSIR bilingual seal mark">
  <title>IKSIR — Bilingual Seal mark</title>
  <desc>Compact bilingual seal: Arabic إكسير arched on top, Latin IKSIR arched on bottom, central crescent + droplet motif.</desc>
  <defs>
    <style>
      .iksir-latin-s { font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif; font-weight: 600; letter-spacing: 0.32em; }
      .iksir-arabic-s { font-family: 'Amiri', 'Noto Naskh Arabic', serif; font-weight: 600; }
    </style>
    <path id="arA" d="M 18 50 A 32 32 0 0 1 82 50" fill="none"/>
    <path id="laA" d="M 18 50 A 32 32 0 0 0 82 50" fill="none"/>
  </defs>
  <g fill="currentColor">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="0.4"/>
    <text class="iksir-arabic-s" font-size="11" fill="currentColor" text-anchor="middle">
      <textPath href="#arA" startOffset="50%">إكسير</textPath>
    </text>
    <text class="iksir-latin-s" font-size="7" fill="currentColor" text-anchor="middle">
      <textPath href="#laA" startOffset="50%">IKSIR</textPath>
    </text>
    <g transform="translate(50,52)">
      <path d="M -7 -4 A 9 9 0 1 0 -7 6 A 7 7 0 1 1 -7 -4 Z" fill="currentColor"/>
      <path d="M 4 -1 C 4 -5, 7 -7, 7 -2 C 7 2, 4 3, 4 -1 Z" fill="currentColor"/>
    </g>
  </g>
</svg>
