<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="IKSIR crescent-counter mark">
  <title>IKSIR — Crescent-Counter mark</title>
  <desc>A circle with a crescent formed by negative space and a single dot — works as favicon, app icon, and stamp.</desc>
  <defs>
    <mask id="ccMask">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <circle cx="58" cy="50" r="22" fill="black"/>
    </mask>
  </defs>
  <g fill="currentColor">
    <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="6"/>
    <g mask="url(#ccMask)">
      <circle cx="46" cy="50" r="22" fill="currentColor"/>
    </g>
    <circle cx="46" cy="20" r="4" fill="currentColor"/>
  </g>
</svg>
