<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="IKSIR — drop-and-crescent wordmark">
  <title>IKSIR — Drop &amp; Crescent wordmark</title>
  <desc>Soft modern serif wordmark; the mark is a crescent cradling a single droplet — a wellness signal layered onto the heritage cue.</desc>
  <defs>
    <style>
      .iksir-soft { font-family: 'Cormorant Garamond', 'Cormorant', 'Saol Display', 'Tiempos', Georgia, serif; font-weight: 400; letter-spacing: 0.30em; font-style: normal; }
    </style>
  </defs>

  <g id="mark-dc" transform="translate(22,18)" fill="currentColor">
    <path d="M 84 50 A 40 40 0 1 1 38 11 A 30 30 0 1 0 84 50 Z" fill="currentColor"/>
    <path d="M 56 36 C 56 28, 64 22, 64 32 C 64 42, 56 44, 56 36 Z" fill="currentColor" opacity="0.95"/>
  </g>

  <g id="word-dc" transform="translate(140,0)" fill="currentColor">
    <text class="iksir-soft" x="0" y="80" font-size="68">IKSIR</text>
  </g>
</svg>
